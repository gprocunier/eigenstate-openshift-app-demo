---
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel9:latest

dependencies:
  galaxy: requirements.yml
  system: bindep.txt

additional_build_steps:
  prepend_final:
    - ARG OPENSHIFT_CLIENT_TARBALL_URL=https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
  append_final:
    - RUN mkdir -p /etc/ipa && chgrp -R 0 /etc/ipa && chmod -R g+rwX /etc/ipa
    - RUN curl -fsSL "${OPENSHIFT_CLIENT_TARBALL_URL}" -o /tmp/openshift-client-linux.tar.gz
    - RUN tar -xzf /tmp/openshift-client-linux.tar.gz -C /usr/local/bin oc kubectl && chmod 0755 /usr/local/bin/oc /usr/local/bin/kubectl && rm -f /tmp/openshift-client-linux.tar.gz
