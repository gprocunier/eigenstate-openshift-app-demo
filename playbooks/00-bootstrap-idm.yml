#!/usr/bin/ansible-playbook
---
- name: Bootstrap IdM objects for the podinfo demo
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/podinfo.yml

  vars:
    support_user_password: >-
      {{
        lookup('env', 'SUPPORT_USER_PASSWORD')
        | default(lookup('env', 'LAB_DEFAULT_PASSWORD'), true)
      }}

  tasks:
    - name: Assert route identity inputs are present
      ansible.builtin.assert:
        that:
          - route_fqdn | length > 0
          - service_principal | length > 0
        fail_msg: "Run prepare-demo.sh or pass route_fqdn and service_principal."

    - name: Ensure demo runtime directory exists
      ansible.builtin.file:
        path: "{{ demo_dir }}"
        state: directory
        mode: "0700"

    - name: Ensure route host object exists in IdM
      freeipa.ansible_freeipa.ipahost:
        name: "{{ route_fqdn }}"
        force: true
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        ipaadmin_password: "{{ lookup('env', 'IPA_ADMIN_PASSWORD') }}"

    - name: Ensure HTTP service principal exists in IdM
      freeipa.ansible_freeipa.ipaservice:
        name: "{{ service_principal }}"
        force: true
        allow_retrieve_keytab_user:
          - "{{ ipaadmin_principal }}"
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        ipaadmin_password: "{{ lookup('env', 'IPA_ADMIN_PASSWORD') }}"

    - name: Try to retrieve existing service keytab
      ansible.builtin.set_fact:
        bootstrap_keytab_b64: >-
          {{ lookup('eigenstate.ipa.keytab',
                    service_principal,
                    retrieve_mode='retrieve',
                    server=ipa_server,
                    ipaadmin_principal=ipaadmin_principal,
                    ipaadmin_password=lookup('env', 'IPA_ADMIN_PASSWORD'),
                    verify=ipa_verify) }}
      register: retrieve_keytab
      ignore_errors: true
      changed_when: false
      no_log: true

    - name: Generate initial service keytab when no keys exist
      ansible.builtin.set_fact:
        bootstrap_keytab_b64: >-
          {{ lookup('eigenstate.ipa.keytab',
                    service_principal,
                    retrieve_mode='generate',
                    server=ipa_server,
                    ipaadmin_principal=ipaadmin_principal,
                    ipaadmin_password=lookup('env', 'IPA_ADMIN_PASSWORD'),
                    verify=ipa_verify) }}
      when: retrieve_keytab is failed
      no_log: true
      changed_when: true

    - name: Write bootstrap service keytab
      ansible.builtin.copy:
        dest: "{{ bootstrap_keytab_path }}"
        content: "{{ bootstrap_keytab_b64 | b64decode }}"
        mode: "0600"
      no_log: true

    - name: Lock down bootstrap keytab
      ansible.builtin.file:
        path: "{{ bootstrap_keytab_path }}"
        mode: "0600"
      no_log: true

    - name: Ensure support group exists
      freeipa.ansible_freeipa.ipagroup:
        name: "{{ lease_group }}"
        description: Podinfo support lease users
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        ipaadmin_password: "{{ lookup('env', 'IPA_ADMIN_PASSWORD') }}"

    - name: Ensure support user exists
      freeipa.ansible_freeipa.ipauser:
        name: "{{ lease_user }}"
        first: Podinfo
        last: Support
        shell: /bin/bash
        password: "{{ support_user_password if support_user_password | length > 0 else omit }}"
        update_password: on_create
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        ipaadmin_password: "{{ lookup('env', 'IPA_ADMIN_PASSWORD') }}"
      no_log: "{{ support_user_password | length > 0 }}"

    - name: Ensure support user is in support group
      freeipa.ansible_freeipa.ipagroup:
        name: "{{ lease_group }}"
        user:
          - "{{ lease_user }}"
        action: member
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        ipaadmin_password: "{{ lookup('env', 'IPA_ADMIN_PASSWORD') }}"

    - name: Archive support user password when supplied
      eigenstate.ipa.vault_write:
        name: "{{ support_password_vault }}"
        state: archived
        shared: true
        data: "{{ support_user_password }}"
        description: "Password for {{ lease_user }} in the podinfo demo"
        server: "{{ ipa_server }}"
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        verify: "{{ ipa_verify }}"
      no_log: true
      when: support_user_password | length > 0

    - name: Ensure HBAC rule exists
      freeipa.ansible_freeipa.ipahbacrule:
        name: podinfo-support-ssh
        description: Allow podinfo support lease validation over SSH
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        ipaadmin_password: "{{ lookup('env', 'IPA_ADMIN_PASSWORD') }}"

    - name: Ensure HBAC user scope
      freeipa.ansible_freeipa.ipahbacrule:
        name: podinfo-support-ssh
        group:
          - "{{ lease_group }}"
        action: member
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        ipaadmin_password: "{{ lookup('env', 'IPA_ADMIN_PASSWORD') }}"

    - name: Ensure HBAC host scope
      freeipa.ansible_freeipa.ipahbacrule:
        name: podinfo-support-ssh
        host:
          - "{{ validation_host }}"
        action: member
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        ipaadmin_password: "{{ lookup('env', 'IPA_ADMIN_PASSWORD') }}"

    - name: Ensure HBAC service scope
      freeipa.ansible_freeipa.ipahbacrule:
        name: podinfo-support-ssh
        hbacsvc:
          - "{{ validation_hbac_service }}"
        action: member
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        ipaadmin_password: "{{ lookup('env', 'IPA_ADMIN_PASSWORD') }}"

    - name: Ensure sudo rule exists
      freeipa.ansible_freeipa.ipasudorule:
        name: "{{ support_sudo_rule }}"
        description: Podinfo support validation command scope
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        ipaadmin_password: "{{ lookup('env', 'IPA_ADMIN_PASSWORD') }}"

    - name: Show bootstrap summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ route_fqdn }}"
          - "Service principal: {{ service_principal }}"
          - "Service keytab: initialized for preflight retrieval"
          - "Vault: {{ vault_name }}"
          - "Support user: {{ lease_user }}"
          - "HBAC: podinfo-support-ssh"
          - "Sudo: {{ support_sudo_rule }}"
