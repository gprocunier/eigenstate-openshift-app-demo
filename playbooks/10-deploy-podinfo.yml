#!/usr/bin/ansible-playbook
---
- name: Deploy podinfo in OpenShift
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/podinfo.yml

  tasks:
    - name: Assert route FQDN is present
      ansible.builtin.assert:
        that:
          - route_fqdn | length > 0
        fail_msg: "Run prepare-demo.sh or pass route_fqdn."

    - name: Apply podinfo OpenShift resources
      ansible.builtin.command:
        argv:
          - oc
          - apply
          - -f
          - "-"
        stdin: "{{ podinfo_manifest | to_nice_yaml }}"
      vars:
        podinfo_manifest:
          apiVersion: v1
          kind: List
          items:
            - apiVersion: project.openshift.io/v1
              kind: Project
              metadata:
                name: "{{ demo_namespace }}"
            - apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: "{{ app_name }}"
                namespace: "{{ demo_namespace }}"
                labels:
                  app.kubernetes.io/name: "{{ app_name }}"
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app.kubernetes.io/name: "{{ app_name }}"
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/name: "{{ app_name }}"
                  spec:
                    containers:
                      - name: "{{ app_name }}"
                        image: "{{ app_image }}"
                        ports:
                          - containerPort: "{{ app_port }}"
                            name: http
                        readinessProbe:
                          httpGet:
                            path: /readyz
                            port: http
                          initialDelaySeconds: 5
                          periodSeconds: 5
                        livenessProbe:
                          httpGet:
                            path: /healthz
                            port: http
                          initialDelaySeconds: 10
                          periodSeconds: 10
            - apiVersion: v1
              kind: Service
              metadata:
                name: "{{ service_name }}"
                namespace: "{{ demo_namespace }}"
              spec:
                selector:
                  app.kubernetes.io/name: "{{ app_name }}"
                ports:
                  - name: http
                    port: 80
                    targetPort: http
            - apiVersion: route.openshift.io/v1
              kind: Route
              metadata:
                name: "{{ route_name }}"
                namespace: "{{ demo_namespace }}"
              spec:
                host: "{{ route_fqdn }}"
                to:
                  kind: Service
                  name: "{{ service_name }}"
                port:
                  targetPort: http
      register: oc_apply
      changed_when: "'configured' in oc_apply.stdout or 'created' in oc_apply.stdout"

    - name: Wait for podinfo deployment rollout
      ansible.builtin.command:
        argv:
          - oc
          - -n
          - "{{ demo_namespace }}"
          - rollout
          - status
          - "deployment/{{ app_name }}"
          - --timeout=180s
      changed_when: false

    - name: Show OpenShift resources
      ansible.builtin.command:
        argv:
          - oc
          - -n
          - "{{ demo_namespace }}"
          - get
          - deploy,svc,route
      register: oc_get
      changed_when: false

    - name: Print podinfo deployment summary
      ansible.builtin.debug:
        msg: "{{ oc_get.stdout_lines }}"
