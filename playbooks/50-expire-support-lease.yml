#!/usr/bin/ansible-playbook
---
- name: Expire support lease
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/podinfo.yml

  tasks:
    - name: Expire support principal and password
      eigenstate.ipa.user_lease:
        username: "{{ lease_user }}"
        state: expired
        password_expiration_matches_principal: true
        require_groups:
          - "{{ lease_group }}"
        server: "{{ ipa_server }}"
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        ipaadmin_password: "{{ lookup('env', 'IPA_ADMIN_PASSWORD') }}"
        verify: "{{ ipa_verify }}"

    - name: Destroy support ticket cache
      community.general.krb_ticket:
        state: absent
        cache_name: "FILE:{{ lease_ccache }}"
      failed_when: false
      changed_when: false

    - name: Retrieve support user password from IdM vault
      ansible.builtin.set_fact:
        support_password: >-
          {{ lookup('eigenstate.ipa.vault',
                    support_password_vault,
                    shared=true,
                    server=ipa_server,
                    ipaadmin_principal=ipaadmin_principal,
                    ipaadmin_password=lookup('env', 'IPA_ADMIN_PASSWORD'),
                    verify=ipa_verify) }}
      no_log: true

    - name: Prove fresh support kinit now fails when password is available
      community.general.krb_ticket:
        principal: "{{ lease_user }}@{{ realm }}"
        password: "{{ support_password }}"
        cache_name: "FILE:{{ lease_ccache }}"
      register: expired_kinit
      failed_when: false
      no_log: true

    - name: Assert fresh support kinit failed after expiry
      ansible.builtin.assert:
        that:
          - not expired_kinit.changed | bool
          - expired_kinit.msg is defined
        fail_msg: "Fresh kinit for {{ lease_user }} still succeeded after IdM expiry."

    - name: Show expiry proof
      ansible.builtin.debug:
        msg: "Fresh kinit for {{ lease_user }} fails after IdM expiry."
